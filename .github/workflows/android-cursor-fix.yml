# Build RustDesk Android APK with the "Show remote cursor" fix.
# Steps mirror the official `build-rustdesk-android` job in flutter-build.yml (RustDesk 1.5.3).
# Run it from the Actions tab -> "Android APK (show-remote-cursor fix)" -> "Run workflow".

name: Android APK (show-remote-cursor fix)

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Target ABI (arm64-v8a fits almost all phones)"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.5.3"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          a='{"abi":"arm64-v8a","target":"aarch64-linux-android","platform":"android-arm64","ndklib":"aarch64-linux-android","script":"ndk_arm64.sh","arch":"aarch64"}'
          b='{"abi":"armeabi-v7a","target":"armv7-linux-androideabi","platform":"android-arm","ndklib":"arm-linux-androideabi","script":"ndk_arm.sh","arch":"armv7"}'
          c='{"abi":"x86_64","target":"x86_64-linux-android","platform":"android-x64","ndklib":"x86_64-linux-android","script":"ndk_x64.sh","arch":"x86_64"}'
          case "${{ inputs.abi }}" in
            arm64-v8a)   list="[$a]" ;;
            armeabi-v7a) list="[$b]" ;;
            x86_64)      list="[$c]" ;;
            *)           list="[$a,$b,$c]" ;;
          esac
          echo "matrix={\"job\":$list}" >> "$GITHUB_OUTPUT"

  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: [plan, generate-bridge]
    name: build apk ${{ matrix.job.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget
          sudo mkdir -p /opt/artifacts
          sudo chown "$USER" /opt/artifacts

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Verify show-remote-cursor fix is present
        run: |
          f=flutter/lib/mobile/pages/remote_page.dart
          if ! grep -q "ShowRemoteCursorState.find(widget.id).isTrue" "$f"; then
            echo "::error::$f is not the patched version. Upload the file from the package first."
            exit 1
          fi
          echo "Fix found in $f"

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == "${{ env.ANDROID_FLUTTER_VERSION }}" ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.script }}

      - name: Build rustdesk apk
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # No release keystore in a fork: sign with the debug key so the APK installs directly.
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          jni=./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          mkdir -p "$jni"
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.ndklib }}/libc++_shared.so "$jni/"
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so "$jni/librustdesk.so"
          pushd flutter
          flutter build apk --release --target-platform ${{ matrix.job.platform }} --split-per-abi
          popd
          mkdir -p out
          mv flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk \
             out/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}-cursorfix.apk
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}-cursorfix
          path: out/*.apk
          if-no-files-found: error
